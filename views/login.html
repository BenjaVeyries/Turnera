<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión • The Barber</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2 { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-300 flex items-center justify-center h-screen selection:bg-amber-500 selection:text-white">

    <header class="fixed top-0 left-0 w-full bg-neutral-950/80 backdrop-blur-md border-b border-white/5 z-10">
        <div class="max-w-6xl mx-auto flex justify-between items-center py-4 px-6">
            <div class="flex items-center gap-2">
                <svg class="w-6 h-6 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <h1 class="text-xl font-bold text-white tracking-wider">THE <span class="text-amber-500">BARBER</span></h1>
            </div>
            <nav class="flex items-center space-x-4">
                <a href="index.html" class="text-sm font-medium text-neutral-400 hover:text-amber-500 transition-colors">Volver al Inicio</a>
            </nav>
        </div>
    </header>

    <div class="bg-neutral-900 border border-white/5 shadow-2xl rounded-2xl p-8 w-96 relative z-0">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <h2 class="text-3xl font-bold text-center mb-8 text-white">Iniciar Sesión</h2>

        <form action="../controllers/auth_login.php" method="POST" class="space-y-5">
            <div>
                <label class="block mb-2 text-sm font-medium text-neutral-400 uppercase tracking-wider">Email</label>
                <input type="email" name="email" required 
                    class="w-full p-3 bg-neutral-950 border border-neutral-800 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition text-white placeholder-neutral-600">
            </div>

            <div>
                <label class="block mb-2 text-sm font-medium text-neutral-400 uppercase tracking-wider">Contraseña</label>
                <input type="password" name="password" required 
                    class="w-full p-3 bg-neutral-950 border border-neutral-800 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition text-white">
            </div>

            <div id="mensaje-error" class="hidden p-3 bg-red-900/20 border border-red-800/50 text-red-400 text-sm rounded-lg text-center">
            </div>

            <button type="submit" class="w-full bg-amber-600 text-white font-bold py-3 rounded-xl hover:bg-amber-700 transition shadow-lg shadow-amber-900/20 tracking-wide">
                INGRESAR
            </button>
        </form>

        <p class="text-center mt-8 text-sm text-neutral-500">
            ¿No tenés cuenta? <a href="registrar.html" class="text-amber-500 hover:text-amber-400 font-medium hover:underline transition">Registrate acá</a>
        </p>
    </div>

    <script>
        // Lógica original intacta
        const params = new URLSearchParams(window.location.search);
        const errorType = params.get('error');
        const divError = document.getElementById('mensaje-error');

        if (errorType) {
            divError.classList.remove('hidden');

            if (errorType === 'blocked') {
                divError.innerHTML = '⚠️ Cuenta bloqueada temporalmente.<br>Esperá 10 minutos.';
            } else {
                divError.textContent = '❌ Email o contraseña incorrectos.';
            }
            
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>

</body>
</html>
